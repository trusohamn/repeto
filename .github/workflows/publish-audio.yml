name: Publish audio
# Adding the "publish-audio" label is the single approval to generate and stage
# audio for the exact PR revision. Merge promotes those reviewed bytes to
# production.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: >-
    publish-audio-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && 'publish' || 'report' }}
  cancel-in-progress: false

jobs:
  report-targets:
    if: >-
      github.event_name == 'pull_request_target'
      && contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action)
      && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted code from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out PR data without executing it
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Report affected audio targets
        run: |
          report=$(python trusted/code/audio_targets.py --base trusted --head pr)
          marker='<!-- repeto-audio-target-report -->'
          body="$marker"$'\n\n'"$report"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -X PATCH -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  pull-request:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.label.name == 'publish-audio'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: audio-production
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Consume approval
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label publish-audio

      - name: Check out trusted code from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      # The PR checkout is treated only as data; all executed scripts come from trusted/.
      - name: Check out the approved PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: pr
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r trusted/requirements.txt -r trusted/requirements-publish.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check the approved revision is still the PR head
        run: |
          current=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::error::The PR changed after approval ($current). Re-add the label to approve it."
            exit 1
          fi

      - name: Generate, verify, and stage audio for the approved revision
        working-directory: pr
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_CACHE_BUCKET: ${{ secrets.R2_CACHE_BUCKET }}
          R2_CACHE_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          R2_CACHE_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
        run: |
          python ../trusted/code/audio_targets.py \
            --base ../trusted --head . --json > "$RUNNER_TEMP/audio-targets.json"
          python ../trusted/code/audio_pipeline.py \
            --root . \
            --targets "$RUNNER_TEMP/audio-targets.json" \
            --pull-request "$PR" \
            --approved-sha "$HEAD_SHA" \
            --report-dir "$RUNNER_TEMP/audio-report"

      - name: Commit staging manifest and audio metadata to the PR branch
        working-directory: pr
        run: |
          current=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::error::The PR changed during audio generation ($current). Re-add the label to approve it."
            exit 1
          fi
          git add -A -- podcast .audio-staging
          unexpected=$(git diff --cached --name-status | grep -Ev \
            $'^(M\tpodcast/[^/]+/(course\\.json|feed\\.xml|index\\.html)|[AM]\t\\.audio-staging/pr-[0-9]+-[0-9a-f]{40}\\.json|D\t\\.audio-staging/pr-[0-9]+-[0-9a-f]{40}\\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes: $unexpected"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Stage reviewed audio for production" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          for report in "$RUNNER_TEMP"/audio-report/*.md; do
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          done

      - name: Report failure
        if: failure()
        run: >-
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body
          "Audio generation or staging failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          — fix the problem and add the \`publish-audio\` label again. Uploads are safe to retry."
