name: Sync Spotify episode IDs
on:
  workflow_run:
    workflows: ["Publish podcasts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spotify-episode-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait 30 minutes for Spotify ingestion after deployment
        if: github.event_name == 'workflow_run'
        run: sleep 1800
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "jinja2>=3.1,<4"
      - name: Test Spotify synchronization
        run: python -m unittest discover -s tests -p "test_spotify_sync.py" -v
      - name: Fetch and match Spotify episodes
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_MARKET: US
        run: python code/spotify_sync.py --root podcast
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: podcast/*/course.json
          branch: automation/spotify-episode-sync
          delete-branch: true
          title: "Sync Spotify episode IDs"
          commit-message: "Sync Spotify episode IDs"
          body: |
            Automated Spotify episode metadata refresh. The workflow summary lists unmatched or ambiguous episodes.

            This pull request only updates stable episode IDs; it does not generate audio or publish the podcast feeds.
