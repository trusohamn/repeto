name: Publish podcasts
on:
  push:
    branches: [main]
    paths: ["podcast/**", "code/podcast.py", "code/website.py", "code/templates/**", "code/site/**", "courses/practice/transcript.json", "courses/practice/topics.json", "courses/stories/*/generated/transcript.json", "tests/test_podcast.py", ".github/workflows/podcast.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: podcast-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install "jinja2>=3.1,<4"
          python -m unittest discover -s tests -p test_podcast.py -v
          python code/podcast.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: podcast
      - uses: actions/deploy-pages@v4
        id: deployment
