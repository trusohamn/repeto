<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ BRAND }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta name="twitter:card" content="summary">
{% if image %}
<meta property="og:image" content="{{ image }}">
{% endif %}
<meta name="theme-color" content="#2e8f8c">
<link rel="icon" type="image/png" sizes="32x32" href="{{ prefix }}favicon.png">
<link rel="apple-touch-icon" href="{{ prefix }}apple-touch-icon.png">
<link rel="stylesheet" href="{{ prefix }}{{ assets.css }}">
<script>document.documentElement.classList.add('js')</script>
<script src="{{ prefix }}{{ assets.js }}" defer></script>
</head>
<body>
<a class="skip" href="#main">{{ t.skip }}</a>
{% set home = prefix or './' %}
<header class="topbar"><div class="wrap"><a class="brand" href="{{ home }}"><img src="{{ prefix }}apple-touch-icon.png" alt="" width="36" height="36"><span>Repeto<b>.stream</b></span></a>
<nav aria-label="Main"><a href="{{ home }}#courses">{{ t.all_courses }}</a></nav></div><div class="progress" aria-hidden="true"></div></header>
{% block body %}{% endblock %}
<footer><div class="wrap"><div><strong>{{ BRAND }}</strong><br>{{ t.open_source }} <a href="{{ GITHUB_URL }}">GitHub</a> · MIT<br>{{ t.voices }}</div>
<div><a href="mailto:{{ EMAIL }}">{{ EMAIL }}</a></div></div></footer>
</body>
</html>
